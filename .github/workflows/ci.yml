name: CI/CD Pipeline

permissions:
  contents: write
on:
  push:
    branches: [main]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. pytest --cov=myapp --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: develop
          fetch-depth: 0

      - name: Add build status badge to README
        run: |
          BADGE='![Build Status](https://github.com/${{ github.repository }}/actions/workflows/ci.yml/badge.svg)'

          if ! grep -q "Build Status" README.md; then
            echo "" >> README.md
            echo "$BADGE" >> README.md
            
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git add README.md
            git commit -m "Add build status badge to README [skip ci]"
            git push origin develop
          else
            echo "Badge already exists"
          fi
